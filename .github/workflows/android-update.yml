name: Android CI (update/ app)

# Builds the real (Canvas-based) game in update/app and uploads the APK.
# The update/.github/workflows path is not a valid workflow location for GitHub,
# so this root-level workflow is what actually exercises :app:assembleDebug.
# Test the actual fixed game, not the abandoned root LibGDX project.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: update

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: update-app-debug-apk
          path: update/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
